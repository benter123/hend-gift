<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية خاصة - هند</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at center, #1f1b24 0%, #0c0a10 100%);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(30, 25, 35, 0.85);
            backdrop-filter: blur(12px);
            padding: 35px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 117, 140, 0.3);
            text-align: center;
            max-width: 380px;
            width: 90%;
            border: 1px solid rgba(255, 117, 140, 0.4);
        }
        input[type="password"] {
            width: 85%;
            padding: 14px;
            margin: 15px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 117, 140, 0.3);
            background: rgba(15, 12, 18, 0.9);
            color: #fff;
            text-align: center;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            outline: none;
        }
        button {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size: 40px; margin-bottom: 5px;">🎁</div>
        <h2 style="margin-top: 5px; color: #ff758c; font-weight: 700; font-size: 20px;">إلى هند الغالية.. ✨</h2>
        <p style="color: #ccc; font-size: 13.5px; line-height: 1.6; margin-bottom: 20px;">
            هذه المساحة أُنشئت لكِ وحدكِ. أدخلي كلمة السر لتتأملي ما في داخلها. 🌸
        </p>
        <form method="POST">
            <input type="password" name="password" placeholder="اكتبي كلمة السر هنا..." required autofocus>
            <br>
            <button type="submit" style="margin-top: 15px;">فتح الهدية 🔓</button>
        </form>
    </div>
</body>
</html>
