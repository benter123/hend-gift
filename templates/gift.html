<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية هند - الأظرف السرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at center, #1f1b24 0%, #0c0a10 100%);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        .falling-element {
            position: fixed;
            top: -10px;
            z-index: 1;
            user-select: none;
            pointer-events: none;
            animation: fallDown linear infinite;
        }
        @keyframes fallDown {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.1; }
        }

        .container {
            background: rgba(30, 25, 35, 0.85);
            backdrop-filter: blur(12px);
            padding: 25px 15px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 117, 140, 0.3);
            text-align: center;
            max-width: 420px;
            width: 92%;
            border: 1px solid rgba(255, 117, 140, 0.4);
            position: relative;
            z-index: 10;
        }
        .my-image {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff758c;
            margin-bottom: 12px;
            box-shadow: 0 0 25px rgba(255, 117, 140, 0.8);
            display: block;
            margin-left: auto;
            margin-right: auto;
            animation: imageFloat 3s infinite ease-in-out;
        }
        @keyframes imageFloat {
            0%, 100% { transform: translateY(0); box-shadow: 0 0 20px rgba(255, 117, 140, 0.5); }
            50% { transform: translateY(-6px); box-shadow: 0 0 30px rgba(255, 117, 140, 0.9); }
        }

        .envelopes-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            text-align: right;
        }

        .envelope-card {
            background: rgba(20, 16, 25, 0.95);
            border-radius: 14px;
            padding: 11px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
            border: 2px solid #ff758c;
            box-shadow: 0 0 10px rgba(255, 117, 140, 0.4), inset 0 0 8px rgba(255, 117, 140, 0.2);
            animation: glowingBorder 3s infinite alternate ease-in-out;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        @keyframes glowingBorder {
            0% {
                border-color: #ff758c;
                box-shadow: 0 0 8px rgba(255, 117, 140, 0.4), inset 0 0 5px rgba(255, 117, 140, 0.2);
            }
            50% {
                border-color: #ffeb3b;
                box-shadow: 0 0 20px rgba(255, 235, 59, 0.7), inset 0 0 12px rgba(255, 235, 59, 0.4);
            }
            100% {
                border-color: #ff758c;
                box-shadow: 0 0 8px rgba(255, 117, 140, 0.4), inset 0 0 5px rgba(255, 117, 140, 0.2);
            }
        }

        .envelope-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(255, 117, 140, 0.9);
        }

        .envelope-title {
            font-size: 14px;
            font-weight: 700;
            color: #ff758c;
            text-shadow: 0 0 5px rgba(255, 117, 140, 0.5);
        }

        .final-gift-btn {
            background: linear-gradient(135deg, #ff7eb3, #ff758c);
            border: 2px dashed #fff;
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: transform 0.2s;
        }
        .final-gift-btn:hover { transform: scale(1.03); }

        .mood-section {
            margin-top: 12px;
            background: rgba(20, 16, 25, 0.6);
            border: 1px solid rgba(255, 117, 140, 0.3);
            border-radius: 14px;
            padding: 10px;
        }
        .mood-title {
            font-size: 12.5px;
            color: #ffb1c1;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .mood-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 7px;
        }
        .mood-btn {
            background: rgba(30, 25, 35, 0.9);
            border: 1px solid rgba(255, 117, 140, 0.5);
            color: #fff;
            padding: 8px 5px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mood-btn:hover {
            background: #ff758c;
            color: #fff;
            border-color: #ffeb3b;
            transform: scale(1.03);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: linear-gradient(145deg, #251e2b, #15111a);
            border: 2px solid #ff758c;
            padding: 22px;
            border-radius: 20px;
            width: 85%;
            max-width: 350px;
            text-align: right;
            box-shadow: 0 0 30px rgba(255, 117, 140, 0.7);
        }
        .modal-text {
            font-size: 14px;
            line-height: 1.8;
            color: #fce4ec;
            margin-bottom: 18px;
        }
        .close-modal {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }

        .insta-btn {
            display: block;
            margin: 12px auto 0 auto;
            text-align: center;
            padding: 10px 20px;
            background: linear-gradient(135deg, #1877f2, #0099ff);
            color: white;
            text-decoration: none;
            border-radius: 22px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            box-shadow: 0 5px 20px rgba(24, 119, 242, 0.5);
            transition: transform 0.2s;
        }
        .insta-btn:hover { transform: scale(1.03); }
    </style>
</head>
<body>

    <script>
        const symbols = ['🌹', '💖', '✨', '🌸', '❤️'];
        for (let i = 0; i < 20; i++) {
            let span = document.createElement('div');
            span.className = 'falling-element';
            span.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            span.style.left = Math.random() * 100 + 'vw';
            span.style.animationDuration = (Math.random() * 4 + 3) + 's';
            span.style.fontSize = (Math.random() * 12 + 14) + 'px';
            span.style.animationDelay = (Math.random() * 3) + 's';
            document.body.appendChild(span);
        }
    </script>

    <div class="container">
        <img src="{{ url_for('static', filename='my_photo.jpg') }}" alt="صورة هند" class="my-image">
        
        <h3 style="color: #ff758c; margin: 0 0 10px 0; font-size: 14.5px;">
            💌 أظرف رسائل خاصة موجهة لكِ يا هند ✨
        </h3>

        <!-- الأظرف الثلاثة -->
        <div class="envelopes-container">
            <div class="envelope-card" onclick="openMsg(1)">
                <span class="envelope-title">💌 عندما تشتاقين إليّ...</span>
                <span>🌸</span>
            </div>
            <div class="envelope-card" onclick="openMsg(2)">
                <span class="envelope-title">✨ لماذا أنتِ بالذات؟</span>
                <span>💖</span>
            </div>
            <div class="envelope-card" onclick="openMsg(3)">
                <span class="envelope-title">🌹 عهد مني دائماً وأبداً...</span>
                <span>✨</span>
            </div>
        </div>

        <!-- زر مفاجأة الختام -->
        <button class="final-gift-btn" onclick="openMsg(4)">
            🎁 مفاجأة ختامية خاصة جداً.. اضغطي هنا ✨
        </button>

        <!-- بوصلة المشاعر -->
        <div class="mood-section">
            <div class="mood-title">كيف هي حالتكِ الآن؟ اخترِ ما يناسبكِ 🌸</div>
            <div class="mood-grid">
                <button class="mood-btn" onclick="openMsg(5)">فرحانة 😊</button>
                <button class="mood-btn" onclick="openMsg(6)">مشتاقة لي ❤️</button>
                <button class="mood-btn" onclick="openMsg(7)">تعبانة أو زعلانة 🥺</button>
                <button class="mood-btn" onclick="openMsg(8)">🌸 مفاجأة خفيفة ظريفة</button>
            </div>
        </div>

        <!-- زر إنستغرام بالتسمية الجديدة -->
        <div style="text-align: center;">
            <a href="https://www.instagram.com/be_nt_er?vrfl=eTJuMXhyMWk4ajBz" target="_blank" class="insta-btn">
              🌸 هضرتنا كتكمل هنا في إنستغرام 💬
            </a>
        </div>

        <!-- نافذة عرض الرسائل -->
        <div class="modal" id="msgModal">
            <div class="modal-content">
                <p class="modal-text" id="modalTextBody"></p>
                <button class="close-modal" onclick="closeMsg()">إغلاق الظرف ✖</button>
            </div>
        </div>

        <script>
            const messages = {
                1: "أعرف أنني أحياناً أكون مشغولاً أو بعيداً، لكن أردت أن أذكركِ بشيء واحد: حتى في أهدأ لحظات يومي، اسمكِ ووجهكِ لا يفارقون تفكيري أبداً. هذا الظرف خصيصاً لكِ، لتتأكدي أنني دائماً معكِ بالقلب والروح مهما كانت الظروف. 🌸",
                2: "سألت نفسي مراراً هذا السؤال، وكان الجواب دائماً أسهل وأصدق ما يكون: لأنكِ تمتلكين قدرة عجيبة على نشر السعادة والراحة في روحي بمجرد ابتسامة أو كلمة. وجودكِ في حياتي ليس مجرد صدفة، بل هو أجمل هدية منحني إياها القدر. 💖",
                3: "أعدكِ أن أظل دائماً السند الذي تكتئين عليه، والضحكة التي ترافق أيامكِ، والصدق الذي لا يغيّره الزمن. مهما تقدم بنا العمر وتغيّرت الأماكن، سأظل أهتم بكِ وأحبكِ بنفس الشغف وأكثر. أحبكِ جداً يا هند. ✨",
                4: "🎉 مفاجأة الختام: أردت فقط أن أختتم هذه المساحة البسيطة بتذكيركِ أن ابتسامتكِ هي أجمل ما أرى، وأن وجودكِ يصنع الفارق الحقيقي في حياتي. شكراً لأنكِ أنتِ، وشكراً لكل لحظة جميلة تجمعنا! أحبكِ إلى أبعد حدود الحب. 🌹💖",
                5: "ديمومة الفرح لقلبكِ الجميل! أتمنى أن تبقى هذه الابتسامة المشرقة تزين وجهكِ طوال اليوم، فضحكتكِ هي مصدر طاقة وسعادة لا تنتهي بالنسبة لي. 😊✨",
                6: "حتى وإن كانت المسافات بيننا، تذكري أنني أفكر فيكِ في هذه اللحظة بالذات وبنفس القدر من الشوق وأكثر! قلبي دائماً معكِ يا هند. ❤️",
                7: "أعلم أن الحياة قد تكون متعبة أحياناً، لكن تذكري أنني هنا دائماً لأجلكِ. خذي نفساً عميقاً، وارتاحي، واعلمي أن هناك قلباً ينبض بحبكِ ويتمنى راحتكِ بكل ما أوتي من قوة. 🥺🌸",
                8: "بما أنكِ فتحتي هاد الخانة دابا، فهذه إشارة مني باش نقول ليك: راك ديما على بالي، ومهما كانت الظروف، ابتسامتكِ هي الهدف الأول ديالي. دمتِ لي كل شيء جميل! 💖"
            };

            function openMsg(id) {
                document.getElementById('modalTextBody').innerHTML = messages[id];
                document.getElementById('msgModal').style.display = 'flex';
            }

            function closeMsg() {
                document.getElementById('msgModal').style.display = 'none';
            }
        </script>
    </div>
</body>
</html>
